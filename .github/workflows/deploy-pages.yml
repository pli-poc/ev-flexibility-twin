name: Deploy EV Flexibility Twin to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /ev-flexibility-twin
        run: npm run build:pages
      - name: Check whether GitHub Pages is enabled
        id: pages-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Static build passed. GitHub Pages is not enabled, so deployment is skipped. Enable Pages in repository settings to publish it."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-state.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-state.outputs.enabled == 'true'
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
